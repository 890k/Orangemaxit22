<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Maxit - Étape 8 (Succès)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white shadow-lg rounded-2xl p-6 m-4 text-center">
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-4">
            <svg class="h-8 w-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <span class="bg-orange-600 text-white font-bold px-3 py-1 rounded-lg text-sm">Étape 8 / 8</span>
        <h1 class="text-2xl font-bold text-gray-800 mt-2">Prêt Accordé !</h1>
        <p class="text-sm text-gray-500 mt-1">Le décaissement a été effectué sur votre compte Orange Money.</p>

        <div class="bg-gray-50 border rounded-xl p-4 my-6 text-left text-sm space-y-2">
            <div class="flex justify-between"><span class="text-gray-500">Statut:</span> <span class="font-semibold text-green-600">Validé</span></div>
            <div class="flex justify-between"><span class="text-gray-500">Bénéficiaire:</span> <span id="recName" class="font-semibold text-gray-800">--</span></div>
            <div class="flex justify-between"><span class="text-gray-500">Montant Décaissé:</span> <span id="recAmount" class="font-semibold text-orange-600">--</span></div>
        </div>

        <a href="index.html" class="block w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-lg shadow">
            Terminer & Retour à l'accueil
        </a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('recName').innerText = params.get('fullName') || 'Client';
        document.getElementById('recAmount').innerText = Number(params.get('amount') || 100000).toLocaleString() + ' XOF';
    </script>
</body>
</html>
