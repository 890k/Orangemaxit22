<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Maxit - Étape 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white shadow-lg rounded-2xl p-6 m-4">
        <div class="text-center mb-6">
            <span class="bg-orange-600 text-white font-bold px-3 py-1 rounded-lg text-sm">Étape 3 sur 8</span>
            <h1 class="text-xl font-bold text-gray-800 mt-2">Durée de Remboursement</h1>
        </div>
        <form id="form3" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Choisissez la période</label>
                <select name="term" class="w-full px-4 py-3 border rounded-lg bg-white focus:ring-2 focus:ring-orange-500">
                    <option value="30">30 Jours</option>
                    <option value="60">60 Jours</option>
                    <option value="90">90 Jours</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-lg shadow">Continuer</button>
        </form>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('form3').addEventListener('submit', (e) => {
            e.preventDefault();
            const term = document.querySelector('select[name="term"]').value;
            const url = new URL('page4.html', window.location.origin);
            params.set('term', term);
            url.search = params.toString();
            window.location.href = url.toString();
        });
    </script>
</body>
</html>
